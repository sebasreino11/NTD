[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ntd"
version = "0.1.0"
description = "Network Threat Detection: Isolation Forest anomaly detection for Zeek conn.log"
requires-python = ">=3.10"
dependencies = ["pandas>=2.0", "numpy>=1.24", "scikit-learn>=1.3"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
ntd = "ntd.cli:main"

[tool.setuptools]
packages = ["ntd"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
